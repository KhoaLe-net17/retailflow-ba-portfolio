name: Reproducible defect
description: Report an actual discrepancy in the reference implementation or documentation.
title: "[Defect] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and environment
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behavior
      description: Include requirement/scenario ID, synthetic inputs and relevant error output.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical - duplicate/excess payment or unauthorized financial mutation
        - High - incorrect reservation or state
        - Medium - inconsistent validation or presentation
        - Low - cosmetic
