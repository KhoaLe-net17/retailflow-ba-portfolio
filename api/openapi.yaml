components:
  securitySchemes:
    DemoActor:
      type: apiKey
      in: header
      name: X-Demo-Actor
      description: 'Synthetic fixture only: agent-1, agent-2, manager-1, store-1,
        finance-1, provider-1. Not real authentication.'
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    ReturnInput:
      type: object
      additionalProperties: false
      properties:
        orderId:
          type: string
          minLength: 1
          maxLength: 200
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ReturnItem'
        storeId:
          type: string
          enum:
          - S01
          - S02
          - S03
        reasonCode:
          type: string
          enum:
          - NOT_SUITABLE
          - DAMAGED
          - WRONG_ITEM
      required:
      - orderId
      - items
      - storeId
      - reasonCode
    ReturnItem:
      type: object
      additionalProperties: false
      properties:
        orderLineId:
          type: string
          minLength: 1
          maxLength: 200
        quantity:
          type: integer
          minimum: 1
      required:
      - orderLineId
      - quantity
    Preview:
      type: object
      additionalProperties: false
      properties:
        amountVnd:
          type: integer
          minimum: 0
        currency:
          type: string
          enum:
          - VND
        approvalRequired:
          type: boolean
        policyVersion:
          type: string
        unitIds:
          type: array
          items:
            type: string
      required:
      - amountVnd
      - currency
      - approvalRequired
      - policyVersion
      - unitIds
    ReturnCreated:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - APPROVED
