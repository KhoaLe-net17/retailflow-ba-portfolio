  /refunds:
    post:
      operationId: createRefund
      summary: Create one logical mock refund
      description: FINANCE only; ACCEPTED return required. simulationOutcome explicitly
        selects a fake provider response. No network payment is performed. Replay
        returns original result even if later reconciliation changed current state;
        read workbench for current state.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/Refund'
        '200':
          description: Exact idempotent replay; IDs and original response are preserved.
          content:
            application/json:
              schema: *id001
        '400':
          description: Invalid input / missing or conflicting field
          content:
