openapi: 3.1.1
info:
  title: RetailFlow Reference API
  version: 1.0.0
  description: Synthetic local demonstrator of selected BA rules. Not a production
    retailer API. X-Demo-Actor is a role-test fixture, not authentication. Fixed clock
    and in-memory data reset on restart.
servers:
- url: http://127.0.0.1:4173/api
  description: Loopback-only local reference server
security:
- DemoActor: []
paths:
