 L295.558,557.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="575.23" fill="#000" font-size="14" textLength="258.768" font-family="Arial">Sum(unit net paid) = original line net paid.</text><text x="12" y="591.329" fill="#000" font-size="14" textLength="278.558" font-family="Arial">At most one active ReturnUnit per OrderUnit.</text><text x="12" y="607.428" fill="#000" font-size="14" textLength="266.923" font-family="Arial">Completed units remain active/unavailable.</text></g><g class="entity" data-qualified-name="GMN26" id="ent0027" data-source-line="91"><path d="M652.5,549.099 L652.5,623.493 A0,0 0 0 0 652.5,623.493 L971.485,623.493 A0,0 0 0 0 971.485,623.493 L971.485,559.099 L961.485,549.099 L751.893,549.099 L620.458,477.268 L743.893,549.099 L652.5,549.099 A0,0 0 0 0 652.5,549.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M961.485,549.099 L961.485,559.099 L971.485,559.099 L961.485,549.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="658.5" y="567.23" fill="#000" font-size="14" textLength="182.103" font-family="Arial">One logical refund per return.</text><text x="658.5" y="583.329" fill="#000" font-size="14" textLength="297.985" font-family="Arial">UNKNOWN/PENDING cannot be blindly retried.</text><text x="658.5" y="599.428" fill="#000" font-size="14" textLength="270.813" font-family="Arial">The actual implementation uses SQL tables</text><text x="658.5" y="615.526" fill="#000" font-size="14" textLength="274.729" font-family="Arial">and functions, not these conceptual classes.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk12" data-link-type="association"><path d="M295.027,139.182 C281.291,160.828 264.524,187.251 249.591,210.784" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="227.591" y="206.916" fill="#000" font-size="14" textLength="21.014" font-family="Arial">1..*</text><text x="287.027" y="153.314" fill="#000" font-size="14" font-family="Ar